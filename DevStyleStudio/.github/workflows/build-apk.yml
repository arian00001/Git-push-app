name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Set Android app orientation to landscape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s, count = re.subn(r'(<activity\b[^>]*\bandroid:name="[^"]*MainActivity"[^>]*)(>)',
                             lambda m: re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(1)) + ' android:screenOrientation="landscape"' + m.group(2),
                             s, count=1)
          if count != 1:
              raise SystemExit('Could not find MainActivity in AndroidManifest.xml')
          p.write_text(s)
          PY
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK (optional)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASSWORD" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASSWORD" ]; then
            echo "Signing secrets not configured; skipping signed release APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("RUNNER_TEMP") + "/release-keystore.jks")
                storePassword System.getenv("KS_PASSWORD")
                keyAlias System.getenv("KS_ALIAS")
                keyPassword System.getenv("KS_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          GRADLE
          ./gradlew assembleRelease --no-daemon
      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/dev-style-studio-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk output/dev-style-studio-release.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-apks
          path: output/*.apk
          if-no-files-found: error
