name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager is not available on PATH. Check Android SDK setup."
            if [ -n "${ANDROID_HOME:-}" ]; then
              find "${ANDROID_HOME}" -path '*/bin/sdkmanager' -print 2>/dev/null || true
            fi
            exit 1
          fi

          echo "Using sdkmanager from: $(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
