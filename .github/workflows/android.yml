name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo '::error::Android SDK Platform 35 was not installed.'
            exit 1
          }

      - name: Build debug APK
        id: build
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        id: tests
        if: steps.build.outcome == 'success'
        shell: bash
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          echo 'APK files found:'
          find . -type f -name '*.apk' -not -path '*/.gradle/*' -print || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html
          if-no-files-found: ignore
          retention-days: 14
